<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nativ64 · Import map</title>
<style>
:root {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #232322;
  --border: #2f2f2d;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --st-native: #0ca30c;
  --st-host: #a6e3a1;
  --st-stub: #fab219;
  --st-crash: #d03b3b;
  --st-todo: #3a3a37;
  --st-shipped: #3987e5;
  --ring: #f0efec;
  --brand-a: #ff3d8b;
  --brand-b: #ff8a3d;
  --brand-c: #7b5cff;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) {
    color-scheme: light;
    --surface-0: #f6f5f2;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border: #e3e2dd;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --st-host: #86d486;
    --st-todo: #dddcd6;
    --st-shipped: #2a78d6;
    --ring: #0b0b0b;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --surface-0: #f6f5f2;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e3e2dd;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --st-host: #86d486;
  --st-todo: #dddcd6;
  --st-shipped: #2a78d6;
  --ring: #0b0b0b;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px 64px; }

/* Header: brand lives here, never in the data */
header { position: relative; padding: 28px 0 22px; }
header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--brand-c), var(--brand-a) 45%, var(--brand-b));
  border-radius: 2px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.sun {
  width: 38px; height: 38px; border-radius: 50%; flex: none;
  background:
    repeating-linear-gradient(180deg, transparent 0 22px, var(--surface-0) 22px 24px, transparent 24px 26px, var(--surface-0) 26px 27px),
    linear-gradient(180deg, var(--brand-b), var(--brand-a) 60%, var(--brand-c));
}
.wordmark {
  font-weight: 800; letter-spacing: .18em; font-size: 20px; text-transform: uppercase;
  background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { color: var(--text-muted); font-size: 13px; letter-spacing: .02em; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.theme-btn {
  background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 12px; font: 12px var(--sans); cursor: pointer;
}
.theme-btn:hover { color: var(--text-primary); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(260px, auto) 1fr; gap: 32px; align-items: end; padding: 28px 0 8px; }
.hero-num { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: 28px; font-weight: 700; color: var(--text-secondary); margin-left: 2px; }
.hero-label { color: var(--text-secondary); margin-top: 8px; }
.hero-label b { color: var(--text-primary); font-weight: 600; }
.stack { display: flex; gap: 2px; height: 14px; margin-bottom: 10px; }
.stack span { display: block; height: 100%; min-width: 0; }
.stack span:first-child { border-radius: 4px 0 0 4px; }
.stack span:last-child { border-radius: 0 4px 4px 0; }
.stack span:only-child { border-radius: 4px; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--text-secondary); font-size: 13px; }
.kpi { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.kpi b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* Status swatches: color + icon, never color alone */
.sw {
  width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center;
  font: 700 10px/1 var(--sans); color: #fff; flex: none;
}
.sw[data-s="todo"] { color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.sw[data-s="host"] { color: #0a3a0a; }
.sw[data-s="stub"] { color: #3a2a00; }

/* Filters: one row */
.filters {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 26px 0 18px;
  padding: 10px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  position: sticky; top: 8px; z-index: 5;
}
.search {
  flex: 1 1 260px; background: var(--surface-0); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text-primary); padding: 8px 11px; font: 13px var(--mono);
}
.search:focus { outline: 2px solid var(--brand-a); outline-offset: 1px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary);
  font: 12px var(--sans); cursor: pointer; user-select: none;
}
.chip[aria-pressed="false"] { opacity: .45; }
.chip:hover { color: var(--text-primary); }
.chip:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--brand-a); outline-offset: 2px; }
.match-count { color: var(--text-muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }

/* Areas */
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.area { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 12px; }
.area.wide { grid-column: span 2; }
.area-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.area-name { font-weight: 700; font-size: 14px; }
.area-stat { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.area-stat b { color: var(--text-primary); }
.area .stack { height: 6px; margin-bottom: 12px; }
.area .stack span:first-child { border-radius: 3px 0 0 3px; }
.area .stack span:last-child { border-radius: 0 3px 3px 0; }
.area .stack span:only-child { border-radius: 3px; }
.mods { display: flex; flex-wrap: wrap; gap: 8px; }
.mod { background: var(--surface-2); border-radius: 8px; padding: 7px 8px 8px; flex: 1 1 140px; min-width: 0; }
.mod-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 6px; }
.mod-name { font-family: var(--mono); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-count { color: var(--text-muted); font-variant-numeric: tabular-nums; flex: none; }
.cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cell {
  width: 11px; height: 11px; border-radius: 2px; background: var(--c); cursor: pointer;
  transition: opacity .12s, transform .12s;
}
.cell[data-s="todo"] { box-shadow: inset 0 0 0 1px var(--border); }
.cell.dim { opacity: .12; }
.cell:hover, .cell.hl { outline: 2px solid var(--ring); outline-offset: 1px; transform: scale(1.15); }

/* Tooltip */
.tip {
  position: fixed; pointer-events: none; z-index: 20; max-width: 420px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 10px 12px; font-size: 12px; display: none;
}
.tip .fn { font: 600 13px var(--mono); color: var(--text-primary); word-break: break-all; }
.tip .mod { all: unset; font: 12px var(--mono); color: var(--text-muted); }
.tip .row { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--text-secondary); }
.tip .imp { margin-top: 6px; color: var(--text-muted); }

/* Table view */
details.table { margin-top: 26px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
details.table summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
.tbl-wrap { max-height: 520px; overflow: auto; border-top: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-1); color: var(--text-muted); font-weight: 600; }
td.mono { font-family: var(--mono); }
td .kpi { gap: 6px; }


/* Tabs: one per view */
.tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--border); }
.tab {
  position: relative; background: none; border: 0; color: var(--text-muted); cursor: pointer;
  font: 600 14px var(--sans); padding: 10px 16px 12px; border-radius: 8px 8px 0 0;
  display: inline-flex; align-items: baseline; gap: 10px;
}
.tab:hover { color: var(--text-primary); background: var(--surface-1); }
.tab .tab-pct { font: 600 12px var(--sans); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--text-primary); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
}
.tab:focus-visible { outline: 2px solid var(--brand-a); outline-offset: -2px; }
.view-title { color: var(--text-secondary); font-size: 13px; margin-top: 14px; }

footer { margin-top: 28px; color: var(--text-muted); font-size: 12px; }
footer code { font-family: var(--mono); color: var(--text-secondary); }
.errors { color: var(--st-crash); }
@media (max-width: 760px) {
  .wrap { padding: 0 16px 48px; }
  .hero { grid-template-columns: 1fr; gap: 16px; }
  .hero-num { font-size: 48px; }
  .area.wide { grid-column: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div class="brand">
        <div class="sun" aria-hidden="true"></div>
        <div>
          <div class="wordmark">nativ64</div>
          <div class="tagline">Import map · port tracker</div>
        </div>
      </div>
      <button class="theme-btn" id="theme" type="button">Theme: auto</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="view-title" id="view-title"></div>

  <section class="hero" aria-label="Overall progress">
    <div>
      <div class="hero-num" id="pct"></div>
      <div class="hero-label" id="hero-label"></div>
    </div>
    <div>
      <div class="stack" id="stack" role="img"></div>
      <div class="kpis" id="kpis"></div>
    </div>
  </section>

  <div class="filters" role="search">
    <input class="search" id="q" type="search" placeholder="Filter functions or modules…" aria-label="Filter functions or modules">
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <span class="match-count" id="matches"></span>
  </div>

  <main class="areas" id="areas"></main>

  <details class="table">
    <summary>Table view</summary>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Status</th><th>Module</th><th>Function</th><th>Area</th><th>Imported by</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </details>

  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script id="report" type="application/json">/*__REPORT__*/null</script>
<script>
(() => {
  const R = JSON.parse(document.getElementById("report").textContent);
  const ORDER = ["native", "host", "stub", "crash", "todo", "shipped"];
  const ICONS = { native: "✓", host: "↗", stub: "~", crash: "!", todo: "·", shipped: "◆" };
  const color = s => `var(--st-${s})`;
  const fmt = n => n.toLocaleString("en-US");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rank = s => ORDER.indexOf(s);

  // Shared, view-independent layout: areas largest first, modules largest first
  const funcs = Object.entries(R.functions).map(([key, f]) => ({ key, ...f }));
  const byKey = new Map(funcs.map(f => [f.key, f]));
  const byArea = new Map();
  for (const f of funcs) {
    if (!byArea.has(f.area)) byArea.set(f.area, new Map());
    const mods = byArea.get(f.area);
    if (!mods.has(f.module)) mods.set(f.module, []);
    mods.get(f.module).push(f);
  }
  const areas = [...byArea.entries()]
    .map(([name, mods]) => ({ name, mods: [...mods.entries()].sort((a, b) => b[1].length - a[1].length),
                              all: [...mods.values()].flat() }))
    .sort((a, b) => b.all.length - a.all.length);

  const el = id => document.getElementById(id);
  const q = el("q"), tip = el("tip"), areasEl = el("areas"), rows = el("rows");
  let V, META, DONE, ST, active, cellEls = [], rowEls = [];

  const doneOf = c => [...DONE].reduce((n, s) => n + (c[s] || 0), 0);
  const sw = s => `<span class="sw" data-s="${s}" style="background:${s === "todo" ? "transparent" : color(s)}">${ICONS[s]}</span>`;
  const stackOf = counts => ["native", "host", "stub", "crash", "todo"]
    .filter(s => counts[s])
    .map(s => `<span style="flex:${counts[s]} 1 0;background:${color(s)}" title="${esc(META[s].label)}: ${fmt(counts[s])}"></span>`)
    .join("");
  const pctOf = v => {
    const need = funcs.length - v.totals.shipped;
    const done = v.done.reduce((n, s) => n + (v.totals[s] || 0), 0);
    return need ? 100 * done / need : 100;
  };

  // Tabs
  const tabs = el("tabs");
  tabs.innerHTML = R.views.map((v, i) =>
    `<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="false">${esc(v.tab)}` +
    `<span class="tab-pct">${pctOf(v).toFixed(1)}%</span></button>`).join("");
  if (R.views.length < 2) tabs.hidden = true;
  tabs.addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (b) select(+b.dataset.i);
  });
  tabs.addEventListener("keydown", e => {
    const cur = R.views.indexOf(V);
    if (e.key === "ArrowRight") select((cur + 1) % R.views.length, true);
    if (e.key === "ArrowLeft") select((cur - 1 + R.views.length) % R.views.length, true);
  });

  function select(i, focus) {
    V = R.views[i] || R.views[0];
    META = Object.fromEntries(ORDER.map(s => [s, { label: V.labels[s], icon: ICONS[s] }]));
    DONE = new Set(V.done);
    ST = V.statuses;
    active = new Set(ORDER);
    tabs.querySelectorAll(".tab").forEach((b, j) => {
      b.setAttribute("aria-selected", j === i);
      b.tabIndex = j === i ? 0 : -1;
      if (j === i && focus) b.focus();
    });
    history.replaceState(null, "", "#" + encodeURIComponent(V.tab));
    document.title = `nativ64 · ${V.title}`;
    el("view-title").textContent = V.title;
    render();
  }

  function render() {
    const t = V.totals;
    const need = funcs.length - t.shipped;
    el("pct").innerHTML = `${pctOf(V).toFixed(1)}<small>%</small>`;
    el("hero-label").innerHTML = `<b>${fmt(doneOf(t))}</b> of <b>${fmt(need)}</b> ${esc(V.headline)}`;
    const stack = el("stack");
    stack.innerHTML = stackOf(t);
    stack.setAttribute("aria-label", ORDER.slice(0, 5).map(s => `${META[s].label} ${t[s]}`).join(", "));
    // Only the statuses this view actually uses
    const used = ORDER.filter(s => t[s]);
    el("kpis").innerHTML = used
      .map(s => `<span class="kpi">${sw(s)}${esc(META[s].label)} <b>${fmt(t[s])}</b></span>`).join("");

    el("chips").innerHTML = used.map(s =>
      `<button class="chip" type="button" data-s="${s}" aria-pressed="true">${sw(s)}${esc(META[s].label)}</button>`).join("");

    const count = (fs, s) => fs.filter(f => ST[f.key] === s).length;
    areasEl.innerHTML = areas.map(a => {
      const c = Object.fromEntries(ORDER.map(s => [s, count(a.all, s)]));
      const n = a.all.length - c.shipped;
      const shipped = c.shipped ? ` · ${fmt(c.shipped)} shipped` : "";
      const wide = a.all.length > 120 ? " wide" : "";
      const mods = a.mods.map(([m, fs]) => {
        const sorted = [...fs].sort((x, y) => rank(ST[x.key]) - rank(ST[y.key]) || x.function.localeCompare(y.function));
        const mn = fs.length - count(fs, "shipped");
        const md = fs.filter(f => DONE.has(ST[f.key])).length;
        const short = m.replace(/^api-ms-win-(core-)?/, "");
        return `<div class="mod"><div class="mod-head"><span class="mod-name" title="${esc(m)}">${esc(short)}</span>` +
          `<span class="mod-count">${mn ? `${md}/${mn}` : "shipped"}</span></div><div class="cells">` +
          sorted.map(f => `<span class="cell" data-k="${esc(f.key)}" data-s="${ST[f.key]}" style="--c:${color(ST[f.key])}"></span>`).join("") +
          `</div></div>`;
      }).join("");
      return `<section class="area${wide}" aria-label="${esc(a.name)}"><div class="area-head"><span class="area-name">${esc(a.name)}</span>` +
        `<span class="area-stat"><b>${fmt(doneOf(c))}</b> / ${fmt(n)} done${shipped}</span></div>` +
        `<div class="stack">${stackOf(c) || `<span style="flex:1;background:${color("shipped")}"></span>`}</div>` +
        `<div class="mods">${mods}</div></section>`;
    }).join("");
    cellEls = [...areasEl.querySelectorAll(".cell")];

    const sorted = [...funcs].sort((a, b) => rank(ST[a.key]) - rank(ST[b.key]) || a.key.localeCompare(b.key));
    rows.innerHTML = sorted.map(f =>
      `<tr data-k="${esc(f.key)}"><td><span class="kpi">${sw(ST[f.key])}${esc(META[ST[f.key]].label)}</span></td>` +
      `<td class="mono">${esc(f.module)}</td><td class="mono">${esc(f.function)}</td><td>${esc(f.area)}</td>` +
      `<td>${esc(f.importers.join(", "))}</td></tr>`).join("");
    rowEls = [...rows.children];
    apply();
  }

  // Filters (status toggles reset on tab change; the search text is kept)
  el("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const s = b.dataset.s;
    active.has(s) ? active.delete(s) : active.add(s);
    b.setAttribute("aria-pressed", active.has(s));
    apply();
  });
  q.addEventListener("input", apply);

  function apply() {
    const needle = q.value.trim().toLowerCase();
    const ok = key => active.has(ST[key]) && (!needle || key.toLowerCase().includes(needle));
    let n = 0;
    for (const c of cellEls) {
      const hit = ok(c.dataset.k);
      c.classList.toggle("dim", !hit);
      if (hit) n++;
    }
    for (const tr of rowEls) tr.hidden = !ok(tr.dataset.k);
    el("matches").textContent = n === funcs.length ? `${fmt(n)} functions` : `${fmt(n)} of ${fmt(funcs.length)} shown`;
  }

  // Tooltip
  areasEl.addEventListener("mousemove", e => {
    const c = e.target.closest(".cell");
    if (!c) { tip.style.display = "none"; return; }
    const f = byKey.get(c.dataset.k), s = ST[f.key];
    tip.innerHTML = `<div class="fn">${esc(f.function)}</div><span class="mod">${esc(f.module)} · ${esc(f.area)}</span>` +
      `<div class="row">${sw(s)}${esc(META[s].label)}</div>` +
      `<div class="imp">Imported by ${esc(f.importers.join(", "))}</div>`;
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + "px";
    tip.style.top = (e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 12 : e.clientY + 16) + "px";
  });
  areasEl.addEventListener("mouseleave", () => (tip.style.display = "none"));

  // Footer
  const errs = Object.entries(R.errors || {});
  el("foot").innerHTML =
    `Read from ${R.inputs.length} file${R.inputs.length > 1 ? "s" : ""}: ${R.inputs.map(i => `<code>${esc(i)}</code>`).join(", ")}. ` +
    `“Shipped” functions come from a DLL inside the game package and run as game code. ` +
    `Module names drop the <code>api-ms-win-core-</code> / <code>api-ms-win-</code> prefix. Static imports only.` +
    (errs.length ? `<div class="errors">Read errors: ${errs.map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("; ")}</div>` : "");

  // Theme toggle: auto → dark → light
  const btn = el("theme");
  const modes = ["auto", "dark", "light"];
  let mode = 0;
  btn.addEventListener("click", () => {
    mode = (mode + 1) % 3;
    const m = modes[mode];
    m === "auto" ? document.documentElement.removeAttribute("data-theme")
                 : document.documentElement.setAttribute("data-theme", m);
    btn.textContent = `Theme: ${m}`;
  });

  // Open the tab named in the URL, else the first one
  const fromHash = R.views.findIndex(v => "#" + encodeURIComponent(v.tab) === location.hash);
  select(fromHash < 0 ? 0 : fromHash);
})();
