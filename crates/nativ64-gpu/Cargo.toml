[package]
name = "nativ64-gpu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ybucaille/nativ64"
description = "Graphics side of nativ64: the Xbox Direct3D 12 exports, natively on Linux"
publish = false

[dependencies]
nativ64 = { path = "../nativ64" }
libc = "0.2"
miniz_oxide = "0.9"
ash = { version = "0.38", features = ["loaded"] }
png = "0.18"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[[bin]]
name = "nativ64-vkdemo"
path = "src/bin/nativ64-vkdemo.rs"
