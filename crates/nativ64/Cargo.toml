[package]
name = "nativ64"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ybucaille/nativ64"
description = "Native Linux implementation of the Windows host APIs a title imports"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nativ64_tsan)"] }
