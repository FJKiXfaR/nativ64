# MangoHud overlay for windowed nativ64 runs: the few numbers that matter, top left.
# Usage: MANGOHUD=1 MANGOHUD_CONFIGFILE=scripts/mangohud.conf ./target/release/nativ64-run ...
# Shift+F12 toggles it.
position=top-left
font_size=18
background_alpha=0.4
fps
frametime
frame_timing=0
ram
procmem
vram
gpu_stats
cpu_stats
toggle_hud=Shift_R+F12
no_display=0
